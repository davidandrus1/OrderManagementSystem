<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Orders - Order Management System</title>
    <link rel="stylesheet" th:href="@{/css/tables.css}" />
</head>

<body>

<div class="page-header">
    <h1>
        <span class="icon">📦</span>
        Orders Management
    </h1>
</div>

<div class="nav-buttons">
    <a th:href="@{/}" class="btn btn-home">
        🏠 Back to Home
    </a>
    <a th:href="@{'/' + ${url} + '/create'}" class="btn btn-create">
        ➕ Create New Order
    </a>
</div>

<div class="filter-container">
    <form th:action="@{'/' + ${url}}" method="get">

        <input type="hidden" name="sortBy" th:value="${currentSort}" />
        <input type="hidden" name="direction" th:value="${currentDirection}" />

        <div class="filter-group">
            <label for="nameFilter">Name:</label>
            <input type="text"
                   id="nameFilter"
                   name="nameFilter"
                   th:value="${nameFilter}"
                   placeholder="Search by name..." />
        </div>

        <div class="filter-group">
            <label for="customerFilter">Customer:</label>
            <select id="customerFilter" name="customerFilter">
                <option value="">-- All --</option>
                <option th:each="customer : ${customers}"
                        th:value="${customer.id}"
                        th:selected="${customerFilter == customer.id}"
                        th:text="${customer.name}"></option>
            </select>
        </div>

        <div class="filter-actions">
            <button type="submit" class="btn btn-filter">🔍 Filter</button>
            <a th:href="@{'/' + ${url}}" class="btn btn-clear">✖️ Clear</a>
        </div>
    </form>
</div>

<div class="table-container">

    <table th:if="${!#lists.isEmpty(items)}">
        <thead>
        <tr>
            <th>ID</th>

            <th class="sortable"
                th:classappend="${currentSort == 'name'} ? (${currentDirection == 'asc'} ? 'sort-asc' : 'sort-desc') : ''">
                <a th:href="${currentSort == 'name' && currentDirection == 'desc'} ?
                        @{'/' + ${url}(nameFilter=${nameFilter},customerFilter=${customerFilter})} :
                        @{'/' + ${url}(sortBy='name',direction=${currentSort == 'name' && currentDirection == 'asc' ? 'desc' : 'asc'},nameFilter=${nameFilter},customerFilter=${customerFilter})}">
                    Name
                </a>
            </th>

            <th class="sortable"
                th:classappend="${currentSort == 'customer.name'} ? (${currentDirection == 'asc'} ? 'sort-asc' : 'sort-desc') : ''">
                <a th:href="${currentSort == 'customer.name' && currentDirection == 'desc'} ?
                        @{'/' + ${url}(nameFilter=${nameFilter},customerFilter=${customerFilter})} :
                        @{'/' + ${url}(sortBy='customer.name',direction=${currentSort == 'customer.name' && currentDirection == 'asc' ? 'desc' : 'asc'},nameFilter=${nameFilter},customerFilter=${customerFilter})}">
                    Customer
                </a>
            </th>

            <th>Contract</th>

            <th class="sortable"
                th:classappend="${currentSort == 'lines'} ? (${currentDirection == 'asc'} ? 'sort-asc' : 'sort-desc') : ''">
                <a th:href="${currentSort == 'lines' && currentDirection == 'desc'} ?
                        @{'/' + ${url}(nameFilter=${nameFilter},customerFilter=${customerFilter})} :
                        @{'/' + ${url}(sortBy='lines',direction=${currentSort == 'lines' && currentDirection == 'asc' ? 'desc' : 'asc'},nameFilter=${nameFilter},customerFilter=${customerFilter})}">
                    Lines
                </a>
            </th>

            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.id}"></td>
            <td th:text="${item.name}"></td>
            <td th:text="${item.customer != null ? item.customer.name : 'N/A'}"></td>
            <td th:text="${item.contract != null ? item.contract.name : 'N/A'}"></td>
            <td th:text="${#lists.size(item.orderLines)}"></td>
            <td>
                <a th:href="@{'/' + ${url} + '/view/' + ${item.id}}">👁️ View Lines</a> |
                <a th:href="@{'/' + ${url} + '/edit/' + ${item.id}}">✏️ Edit</a> |
                <a th:href="@{'/' + ${url} + '/delete/' + ${item.id}}">🗑️ Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="empty-state" th:if="${#lists.isEmpty(items)}">
        <div class="icon">📦</div>
        <h3>No Orders Found</h3>
        <p th:if="${nameFilter != null || customerFilter != null}">
            Try adjusting your filters or
            <a th:href="@{'/' + ${url}}">clear all filters</a>.
        </p>
        <p th:if="${nameFilter == null && customerFilter == null}">
            Click "Create New Order" to get started!
        </p>
    </div>

</div>

</body>
</html>
