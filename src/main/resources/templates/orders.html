<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Orders - Order Management System</title>
    <link rel="stylesheet" th:href="@{/css/tables.css}" />

</head>

<body>

<!-- HEADER -->
<div class="page-header">
    <h1>
        <span class="icon">📦</span>
        Orders Management
    </h1>
</div>

<!-- NAVIGATION BUTTONS -->
<div class="nav-buttons">
    <a th:href="@{/}" class="btn btn-home">
        🏠 Back to Home
    </a>
    <a th:href="@{'/' + ${url} + '/create'}" class="btn btn-create">
        ➕ Create New Order
    </a>
</div>

<!-- TABLE CONTAINER -->
<div class="table-container">

    <!-- TABLE -->
    <table th:if="${!#lists.isEmpty(items)}">
        <thead>
        <tr>
            <th>ID</th>

            <!-- Name - Sortable -->
            <th class="sortable"
                th:classappend="${currentSort == 'name'} ? (${currentDirection == 'asc'} ? 'sort-asc' : 'sort-desc') : ''">
                <a th:href="${currentSort == 'name' && currentDirection == 'desc'} ? @{/orders} : @{/orders(sortBy='name',direction=${currentSort == 'name' && currentDirection == 'asc' ? 'desc' : 'asc'})}">
                    Name
                </a>
            </th>

            <!-- Customer - Sortable -->
            <th class="sortable"
                th:classappend="${currentSort == 'customer.name'} ? (${currentDirection == 'asc'} ? 'sort-asc' : 'sort-desc') : ''">
                <a th:href="${currentSort == 'customer.name' && currentDirection == 'desc'} ? @{/orders} : @{/orders(sortBy='customer.name',direction=${currentSort == 'customer.name' && currentDirection == 'asc' ? 'desc' : 'asc'})}">
                    Customer
                </a>
            </th>

            <th>Contract</th>

            <!-- Lines - Sortable -->
            <th class="sortable"
                th:classappend="${currentSort == 'lines'} ? (${currentDirection == 'asc'} ? 'sort-asc' : 'sort-desc') : ''">
                <a th:href="${currentSort == 'lines' && currentDirection == 'desc'} ? @{/orders} : @{/orders(sortBy='lines',direction=${currentSort == 'lines' && currentDirection == 'asc' ? 'desc' : 'asc'})}">
                    Lines
                </a>
            </th>

            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.id}"></td>
            <td th:text="${item.name}"></td>
            <td th:text="${item.customer?.name}"></td>
            <td th:text="${item.contract?.name ?: 'N/A'}"></td>
            <td th:text="${#lists.size(item.orderLines)}"></td>
            <td>
                <a th:href="@{'/' + ${url} + '/view/' + ${item.id}}">👁️ View Lines</a> |
                <a th:href="@{'/' + ${url} + '/edit/' + ${item.id}}">✏️ Edit</a> |
                <a th:href="@{'/' + ${url} + '/delete/' + ${item.id}}">🗑️ Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- EMPTY STATE -->
    <div class="empty-state" th:if="${#lists.isEmpty(items)}">
        <div class="icon">📦</div>
        <h3>No Orders Found</h3>
        <p>Click "Create New Order" to get started!</p>
    </div>

</div>

</body>
</html>
