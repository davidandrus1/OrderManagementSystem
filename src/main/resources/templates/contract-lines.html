<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Contract Lines</title>
    <link rel="stylesheet" th:href="@{/css/tables.css}" />
</head>

<body>

<div class="page-header">
    <h1>
        <span class="icon">📋</span>
        Contract Lines
    </h1>
</div>

<div class="nav-buttons">
    <a th:href="@{/contracts}" class="btn btn-home">
        ← Back to Contracts
    </a>
    <a th:href="@{'/contract-lines/create/' + ${contract.id}}" class="btn btn-create">
        ➕ Add New Line
    </a>
</div>

<div class="table-container">

    <div style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
        <p><strong>Contract ID:</strong> <span th:text="${contract.id}"></span></p>
        <p><strong>Name:</strong> <span th:text="${contract.name}"></span></p>
        <p><strong>Contract Type:</strong> <span th:text="${contract.contractType.name}"></span></p>
        <p><strong>Status:</strong> <span th:text="${contract.status}"></span></p>
    </div>

    <table th:if="${!#lists.isEmpty(lines)}">
        <thead>
        <tr>
            <th>ID</th>

            <th class="sortable"
                th:classappend="${currentSort == 'item'} ? (${currentDirection == 'asc'} ? 'sort-asc' : 'sort-desc') : ''">
                <a th:href="${currentSort == 'item' && currentDirection == 'desc'} ?
                        @{'/contracts/view/' + ${contract.id}} :
                        @{'/contracts/view/' + ${contract.id}(sortBy='item',direction=${currentSort == 'item' && currentDirection == 'asc' ? 'desc' : 'asc'})}">
                    Item
                </a>
            </th>

            <th class="sortable"
                th:classappend="${currentSort == 'quantity'} ? (${currentDirection == 'asc'} ? 'sort-asc' : 'sort-desc') : ''">
                <a th:href="${currentSort == 'quantity' && currentDirection == 'desc'} ?
                        @{'/contracts/view/' + ${contract.id}} :
                        @{'/contracts/view/' + ${contract.id}(sortBy='quantity',direction=${currentSort == 'quantity' && currentDirection == 'asc' ? 'desc' : 'asc'})}">
                    Quantity
                </a>
            </th>

            <th>Unit</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="line : ${lines}">
            <td th:text="${line.id}"></td>
            <td th:text="${line.sellableItem.name}"></td>
            <td th:text="${line.quantity}"></td>
            <td th:text="${line.unitOfMeasure.symbol}"></td>
            <td>
                <a th:href="@{'/contract-lines/edit/' + ${line.id}}">✏️ Edit</a> |
                <a th:href="@{'/contract-lines/delete/' + ${line.id}}">🗑️ Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="empty-state" th:if="${#lists.isEmpty(lines)}">
        <div class="icon">📋</div>
        <h3>No Lines Found</h3>
        <p>This contract has no lines yet.</p>
        <a th:href="@{'/contract-lines/create/' + ${contract.id}}" class="btn btn-create">Add First Line</a>
    </div>

</div>

</body>
</html>
