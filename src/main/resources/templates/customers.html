<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customers - Order Management System</title>
    <link rel="stylesheet" th:href="@{/css/tables.css}" />

</head>

<body>

<!-- HEADER -->
<div class="page-header">
    <h1>
        <span class="icon">👥</span>
        Customers Management
    </h1>
</div>

<!-- NAVIGATION BUTTONS -->
<div class="nav-buttons">
    <a th:href="@{/}" class="btn btn-home">
        🏠 Back to Home
    </a>
    <a th:href="@{'/' + ${url} + '/create'}" class="btn btn-create">
        ➕ Create New Customer
    </a>
</div>

<!-- TABLE CONTAINER -->
<div class="table-container">

    <!-- TABLE -->
    <table th:if="${!#lists.isEmpty(items)}">
        <thead>
        <tr>
            <th>ID</th>

            <!-- Name - Sortable -->
            <th class="sortable"
                th:classappend="${currentSort == 'name'} ? (${currentDirection == 'asc'} ? 'sort-asc' : 'sort-desc') : ''">
                <a th:href="${currentSort == 'name' && currentDirection == 'desc'} ? @{/customers} : @{/customers(sortBy='name',direction=${currentSort == 'name' && currentDirection == 'asc' ? 'desc' : 'asc'})}">
                    Name
                </a>
            </th>

            <!-- Currency - Sortable -->
            <th class="sortable"
                th:classappend="${currentSort == 'currency'} ? (${currentDirection == 'asc'} ? 'sort-asc' : 'sort-desc') : ''">
                <a th:href="${currentSort == 'currency' && currentDirection == 'desc'} ? @{/customers} : @{/customers(sortBy='currency',direction=${currentSort == 'currency' && currentDirection == 'asc' ? 'desc' : 'asc'})}">
                    Currency
                </a>
            </th>

            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.id}"></td>
            <td th:text="${item.name}"></td>
            <td th:text="${item.currency}"></td>
            <td>
                <a th:href="@{/customers/{id}/orders(id=${item.id})}">📦 View Orders</a> |
                <a th:href="@{/customers/{id}/contracts(id=${item.id})}">📄 View Contracts</a> |
                <a th:href="@{/customers/edit/{id}(id=${item.id})}">✏️ Edit</a> |
                <a th:href="@{/customers/delete/{id}(id=${item.id})}">🗑️ Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- EMPTY STATE -->
    <div class="empty-state" th:if="${#lists.isEmpty(items)}">
        <div class="icon">👥</div>
        <h3>No Customers Found</h3>
        <p>Click "Create New Customer" to get started!</p>
    </div>

</div>

</body>
</html>
