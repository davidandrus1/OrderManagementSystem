<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customers - Order Management System</title>
    <link rel="stylesheet" th:href="@{/css/tables.css}" />
</head>

<body>

<div class="page-header">
    <h1>
        <span class="icon">👥</span>
        Customers Management
    </h1>
</div>

<div class="nav-buttons">
    <a th:href="@{/}" class="btn btn-home">
        🏠 Back to Home
    </a>
    <a th:href="@{'/' + ${url} + '/create'}" class="btn btn-create">
        ➕ Create New Customer
    </a>
</div>

<div class="filter-container">
    <form th:action="@{'/' + ${url}}" method="get">

        <input type="hidden" name="sortBy" th:value="${currentSort}" />
        <input type="hidden" name="direction" th:value="${currentDirection}" />

        <div class="filter-group">
            <label for="nameFilter">Name:</label>
            <input type="text"
                   id="nameFilter"
                   name="nameFilter"
                   th:value="${nameFilter}"
                   placeholder="Search by name..." />
        </div>

        <div class="filter-group">
            <label for="currencyFilter">Currency:</label>
            <select id="currencyFilter" name="currencyFilter">
                <option value="">-- All --</option>
                <option value="USD" th:selected="${currencyFilter == 'USD'}">USD</option>
                <option value="EUR" th:selected="${currencyFilter == 'EUR'}">EUR</option>
                <option value="GBP" th:selected="${currencyFilter == 'GBP'}">GBP</option>
                <option value="RON" th:selected="${currencyFilter == 'RON'}">RON</option>
            </select>
        </div>

        <div class="filter-actions">
            <button type="submit" class="btn btn-filter">🔍 Filter</button>
            <a th:href="@{'/' + ${url}}" class="btn btn-clear">✖️ Clear</a>
        </div>
    </form>
</div>

<div class="table-container">

    <table th:if="${!#lists.isEmpty(items)}">
        <thead>
        <tr>
            <th>ID</th>

            <th class="sortable"
                th:classappend="${currentSort == 'name'} ? (${currentDirection == 'asc'} ? 'sort-asc' : 'sort-desc') : ''">
                <a th:href="${currentSort == 'name' && currentDirection == 'desc'} ?
                        @{'/' + ${url}(nameFilter=${nameFilter},currencyFilter=${currencyFilter})} :
                        @{'/' + ${url}(sortBy='name',direction=${currentSort == 'name' && currentDirection == 'asc' ? 'desc' : 'asc'},nameFilter=${nameFilter},currencyFilter=${currencyFilter})}">
                    Name
                </a>
            </th>

            <th class="sortable"
                th:classappend="${currentSort == 'currency'} ? (${currentDirection == 'asc'} ? 'sort-asc' : 'sort-desc') : ''">
                <a th:href="${currentSort == 'currency' && currentDirection == 'desc'} ?
                        @{'/' + ${url}(nameFilter=${nameFilter},currencyFilter=${currencyFilter})} :
                        @{'/' + ${url}(sortBy='currency',direction=${currentSort == 'currency' && currentDirection == 'asc' ? 'desc' : 'asc'},nameFilter=${nameFilter},currencyFilter=${currencyFilter})}">
                    Currency
                </a>
            </th>

            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.id}"></td>
            <td th:text="${item.name}"></td>
            <td th:text="${item.currency}"></td>
            <td>
                <a th:href="@{'/customers/' + ${item.id} + '/orders'}">📦 Orders</a> |
                <a th:href="@{'/customers/' + ${item.id} + '/contracts'}">📄 Contracts</a> |
                <a th:href="@{'/' + ${url} + '/edit/' + ${item.id}}">✏️ Edit</a> |
                <a th:href="@{'/' + ${url} + '/delete/' + ${item.id}}">🗑️ Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="empty-state" th:if="${#lists.isEmpty(items)}">
        <div class="icon">👥</div>
        <h3>No Customers Found</h3>
        <p th:if="${nameFilter != null || currencyFilter != null}">
            Try adjusting your filters or
            <a th:href="@{'/' + ${url}}">clear all filters</a>.
        </p>
        <p th:if="${nameFilter == null && currencyFilter == null}">
            Click "Create New Customer" to get started!
        </p>
    </div>

</div>

</body>
</html>
