<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}"></title>
    <link rel="stylesheet" th:href="@{/css/forms.css}" />
</head>

<body>

<div class="page-header">
    <h1>
        <span class="icon">📄</span>
        <span th:text="${title}">Form Title</span>
    </h1>
</div>

<a th:href="@{'/' + ${url}}" class="back-link">
    ← Back to List
</a>

<div class="form-container">

    <div class="delete-warning" th:if="${action == 'delete'}">
        <h3>⚠️ Warning!</h3>
        <p>Are you sure you want to delete this contract? This action cannot be undone.</p>
    </div>

    <form th:action="@{'/' + ${url} + '/save'}" th:object="${item}" method="post">

        <input type="hidden" th:field="*{id}" />
        <input type="hidden" name="action" th:value="${action}" />

        <fieldset style="border: none; padding: 0; margin: 0;" th:disabled="${action == 'delete'}">

            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" th:field="*{name}" />
                <div class="error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="form-group">
                <label for="contractType">Contract Type:</label>
                <select id="contractType" th:field="*{contractType.id}">
                    <option value="">-- Select Contract Type --</option>
                    <option th:each="type : ${contractTypes}"
                            th:value="${type.id}"
                            th:text="${type.name}"></option>
                </select>
                <div class="error-message" th:if="${#fields.hasErrors('contractType')}" th:errors="*{contractType}"></div>
            </div>

            <div class="form-group">
                <label for="status">Status:</label>
                <select id="status" th:field="*{status}">
                    <option value="">-- Select Status --</option>
                    <option value="Active">Active</option>
                    <option value="Down">Down</option>
                </select>
                <div class="error-message" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
            </div>

            <div class="form-group">
                <label for="customer">Customer (optional):</label>
                <select id="customer" th:field="*{customer.id}">
                    <option value="">-- No Customer --</option>
                    <option th:each="cust : ${customers}"
                            th:value="${cust.id}"
                            th:text="${cust.name}"></option>
                </select>
            </div>

        </fieldset>

        <div class="form-actions">
            <button type="submit"
                    th:class="${action == 'delete'} ? 'btn btn-danger' : 'btn btn-primary'"
                    th:text="${caption}">
                Submit
            </button>
            <a th:href="@{'/' + ${url}}" class="btn btn-secondary">Cancel</a>
        </div>

    </form>

</div>

</body>
</html>
