<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Units of Measure - Order Management System</title>
    <link rel="stylesheet" th:href="@{/css/tables.css}" />
</head>

<body>

<!-- HEADER -->
<div class="page-header">
    <h1>
        <span class="icon">📏</span>
        Units of Measure Management
    </h1>
</div>

<!-- NAVIGATION BUTTONS -->
<div class="nav-buttons">
    <a th:href="@{/}" class="btn btn-home">
        🏠 Back to Home
    </a>
    <a th:href="@{'/' + ${url} + '/create'}" class="btn btn-create">
        ➕ Create New Unit
    </a>
</div>

<!-- ✅ FILTER FORM -->
<div class="filter-container">
    <form th:action="@{'/' + ${url}}" method="get">
        <div class="filter-group">
            <label for="nameFilter">Name:</label>
            <input type="text"
                   id="nameFilter"
                   name="nameFilter"
                   th:value="${nameFilter}"
                   placeholder="Search by name..." />
        </div>

        <div class="filter-group">
            <label for="symbolFilter">Symbol:</label>
            <input type="text"
                   id="symbolFilter"
                   name="symbolFilter"
                   th:value="${symbolFilter}"
                   placeholder="Search by symbol..." />
        </div>

        <div class="filter-actions">
            <button type="submit" class="btn btn-filter">🔍 Filter</button>
            <a th:href="@{'/' + ${url}}" class="btn btn-clear">✖️ Clear</a>
        </div>
    </form>
</div>

<!-- TABLE CONTAINER -->
<div class="table-container">

    <!-- TABLE -->
    <table th:if="${!#lists.isEmpty(items)}">
        <thead>
        <tr>
            <th>ID</th>

            <!-- Name - Sortable -->
            <th class="sortable"
                th:classappend="${currentSort == 'name'} ? (${currentDirection == 'asc'} ? 'sort-asc' : 'sort-desc') : ''">
                <a th:href="${currentSort == 'name' && currentDirection == 'desc'} ? @{'/' + ${url}} : @{'/' + ${url}(sortBy='name',direction=${currentSort == 'name' && currentDirection == 'asc' ? 'desc' : 'asc'})}">
                    Name
                </a>
            </th>

            <!-- Symbol - Sortable -->
            <th class="sortable"
                th:classappend="${currentSort == 'symbol'} ? (${currentDirection == 'asc'} ? 'sort-asc' : 'sort-desc') : ''">
                <a th:href="${currentSort == 'symbol' && currentDirection == 'desc'} ? @{'/' + ${url}} : @{'/' + ${url}(sortBy='symbol',direction=${currentSort == 'symbol' && currentDirection == 'asc' ? 'desc' : 'asc'})}">
                    Symbol
                </a>
            </th>

            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.id}"></td>
            <td th:text="${item.name}"></td>
            <td th:text="${item.symbol}"></td>
            <td>
                <a th:href="@{'/' + ${url} + '/edit/' + ${item.id}}">✏️ Edit</a> |
                <a th:href="@{'/' + ${url} + '/delete/' + ${item.id}}">🗑️ Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- EMPTY STATE -->
    <div class="empty-state" th:if="${#lists.isEmpty(items)}">
        <div class="icon">📏</div>
        <h3>No Units Found</h3>
        <p th:if="${nameFilter != null || symbolFilter != null}">
            Try adjusting your filters or <a th:href="@{'/' + ${url}}">clear all filters</a>.
        </p>
        <p th:if="${nameFilter == null && symbolFilter == null}">
            Click "Create New Unit" to get started!
        </p>
    </div>

</div>

</body>
</html>
