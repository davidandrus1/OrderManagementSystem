<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order Lines</title>
    <link rel="stylesheet" th:href="@{/css/tables.css}" />
</head>

<body>

<div class="page-header">
    <h1>
        <span class="icon">📋</span>
        Order Lines
    </h1>
</div>

<div class="nav-buttons">
    <a th:href="@{/orders}" class="btn btn-home">
        ← Back to Orders
    </a>
    <a th:href="@{'/order-lines/create/' + ${order.id}}" class="btn btn-create">
        ➕ Add New Line
    </a>
</div>

<div class="table-container">

    <div style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
        <p><strong>Order ID:</strong> <span th:text="${order.id}"></span></p>
        <p><strong>Name:</strong> <span th:text="${order.name}"></span></p>
        <p><strong>Customer:</strong> <span th:text="${order.customer.name}"></span></p>
        <p><strong>Contract:</strong> <span th:text="${order.contract != null ? order.contract.name : 'N/A'}"></span></p>
    </div>

    <table th:if="${!#lists.isEmpty(order.orderLines)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Item</th>
            <th>Quantity</th>
            <th>Unit</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="line : ${order.orderLines}">
            <td th:text="${line.id}"></td>
            <td th:text="${line.sellableItem.name}"></td>
            <td th:text="${line.quantity}"></td>
            <td th:text="${line.unitOfMeasure.symbol}"></td>
            <td>
                <a th:href="@{'/order-lines/edit/' + ${line.id}}">✏️ Edit</a> |
                <a th:href="@{'/order-lines/delete/' + ${line.id}}">🗑️ Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="empty-state" th:if="${#lists.isEmpty(order.orderLines)}">
        <div class="icon">📋</div>
        <h3>No Lines Found</h3>
        <p>This order has no lines yet.</p>
        <a th:href="@{'/order-lines/create/' + ${order.id}}" class="btn btn-create">Add First Line</a>
    </div>

</div>

</body>
</html>
