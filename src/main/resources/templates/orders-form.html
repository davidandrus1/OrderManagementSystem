<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}"></title>
    <link rel="stylesheet" th:href="@{/css/forms.css}" />
</head>

<body>

<!-- HEADER -->
<div class="page-header">
    <h1>
        <span class="icon">📦</span>
        <span th:text="${title}">Form Title</span>
    </h1>
</div>

<!-- BACK LINK -->
<a th:href="@{'/' + ${url}}" class="back-link">
    ← Back to List
</a>

<!-- FORM CONTAINER -->
<div class="form-container">

    <!-- DELETE WARNING -->
    <div class="delete-warning" th:if="${action == 'delete'}">
        <h3>⚠️ Warning!</h3>
        <p>Are you sure you want to delete this order? This action cannot be undone.</p>
    </div>

    <!-- FORM -->
    <form th:action="@{'/' + ${url} + '/save'}" th:object="${item}" method="post">

        <!-- Hidden Fields -->
        <input type="hidden" th:field="*{id}" />
        <input type="hidden" name="action" th:value="${action}" />

        <fieldset style="border: none; padding: 0; margin: 0;" th:disabled="${action == 'delete'}">

            <!-- Name Field -->
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" th:field="*{name}" />
                <div class="error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <!-- Customer Field -->
            <div class="form-group">
                <label for="customer">Customer:</label>
                <select id="customer" th:field="*{customer.id}">
                    <option value="">-- Select Customer --</option>
                    <option th:each="customer : ${customers}"
                            th:value="${customer.id}"
                            th:text="${customer.name}"></option>
                </select>
                <div class="error-message" th:if="${#fields.hasErrors('customer')}" th:errors="*{customer}"></div>
            </div>

            <!-- Contract Field (Optional) -->
            <div class="form-group">
                <label for="contract">Contract (optional):</label>
                <select id="contract" th:field="*{contract.id}">
                    <option value="">-- No Contract --</option>
                    <option th:each="contract : ${contracts}"
                            th:value="${contract.id}"
                            th:text="${contract.name}"></option>
                </select>
            </div>

        </fieldset>

        <!-- FORM ACTIONS -->
        <div class="form-actions">
            <button type="submit"
                    th:class="${action == 'delete'} ? 'btn btn-danger' : 'btn btn-primary'"
                    th:text="${caption}">
                Submit
            </button>
            <a th:href="@{'/' + ${url}}" class="btn btn-secondary">Cancel</a>
        </div>

    </form>

</div>

</body>
</html>
