<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Contracts for Customer</title>
    <link rel="stylesheet" th:href="@{/css/tables.css}" />
</head>
<body>

<div class="page-header">
    <h1>
        <span class="icon">📄</span>
        Contracts for <span th:text="${customer.name}"></span>
    </h1>
</div>

<div class="nav-buttons">
    <a th:href="@{/customers}" class="btn btn-home">
        ← Back to Customers
    </a>
    <a th:href="@{/contracts/create}" class="btn btn-create">
        ➕ Create New Contract
    </a>
</div>

<div class="table-container">

    <div style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
        <p><strong>Customer ID:</strong> <span th:text="${customer.id}"></span></p>
        <p><strong>Currency:</strong> <span th:text="${customer.currency}"></span></p>
    </div>

    <table th:if="${!#lists.isEmpty(contracts)}">
        <thead>
        <tr>
            <th>Contract ID</th>
            <th>Contract Name</th>
            <th>Contract Type</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="contract : ${contracts}">
            <td th:text="${contract.id}"></td>
            <td th:text="${contract.name}"></td>
            <td th:text="${contract.contractType != null ? contract.contractType.name : 'N/A'}"></td>
            <td th:text="${contract.status}"></td>
            <td>
                <a th:href="@{'/contracts/view/' + ${contract.id}}">👁️ View Lines</a> |
                <a th:href="@{'/contracts/edit/' + ${contract.id}}">✏️ Edit</a> |
                <a th:href="@{'/contracts/delete/' + ${contract.id}}">🗑️ Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="empty-state" th:if="${#lists.isEmpty(contracts)}">
        <div class="icon">📄</div>
        <h3>No Contracts Found</h3>
        <p>This customer has no contracts yet.</p>
        <a th:href="@{/contracts/create}" class="btn btn-create">Create First Contract</a>
    </div>

</div>

</body>
</html>
