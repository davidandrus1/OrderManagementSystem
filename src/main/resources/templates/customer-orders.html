<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Orders for Customer</title>
    <link rel="stylesheet" th:href="@{/css/tables.css}" />
</head>
<body>

<div class="page-header">
    <h1>
        <span class="icon">📦</span>
        Orders for <span th:text="${customer.name}"></span>
    </h1>
</div>

<div class="nav-buttons">
    <a th:href="@{/customers}" class="btn btn-home">
        ← Back to Customers
    </a>
    <a th:href="@{/orders/create}" class="btn btn-create">
        ➕ Create New Order
    </a>
</div>

<div class="table-container">

    <div style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
        <p><strong>Customer ID:</strong> <span th:text="${customer.id}"></span></p>
        <p><strong>Currency:</strong> <span th:text="${customer.currency}"></span></p>
    </div>

    <table th:if="${!#lists.isEmpty(orders)}">
        <thead>
        <tr>
            <th>Order ID</th>
            <th>Order Name</th>
            <th>Contract</th>
            <th>Lines</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.id}"></td>
            <td th:text="${order.name}"></td>
            <td th:text="${order.contract != null ? order.contract.name : 'N/A'}"></td>
            <td th:text="${#lists.size(order.orderLines)}"></td>
            <td>
                <a th:href="@{'/orders/view/' + ${order.id}}">👁️ View Lines</a> |
                <a th:href="@{'/orders/edit/' + ${order.id}}">✏️ Edit</a> |
                <a th:href="@{'/orders/delete/' + ${order.id}}">🗑️ Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="empty-state" th:if="${#lists.isEmpty(orders)}">
        <div class="icon">📦</div>
        <h3>No Orders Found</h3>
        <p>This customer has no orders yet.</p>
        <a th:href="@{/orders/create}" class="btn btn-create">Create First Order</a>
    </div>

</div>

</body>
</html>
